<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-fixed": "#ffdcc3",
                    "on-surface-variant": "#3d4a42",
                    "on-primary-fixed": "#002114",
                    "on-tertiary-fixed-variant": "#6e3900",
                    "surface-variant": "#dbe2f8",
                    "inverse-primary": "#68dba9",
                    "error": "#ba1a1a",
                    "on-secondary-container": "#306d58",
                    "surface-dim": "#d2daef",
                    "tertiary-fixed-dim": "#ffb77d",
                    "on-tertiary-container": "#fffbff",
                    "on-secondary-fixed-variant": "#0b513d",
                    "primary-fixed": "#85f8c4",
                    "primary-fixed-dim": "#68dba9",
                    "background": "#f9f9ff",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#006948",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#bccac0",
                    "secondary-container": "#adedd3",
                    "primary-container": "#00855d",
                    "on-error": "#ffffff",
                    "surface-container-highest": "#dbe2f8",
                    "on-tertiary-fixed": "#2f1500",
                    "surface-container-low": "#f1f3ff",
                    "on-primary": "#ffffff",
                    "inverse-on-surface": "#ecf0ff",
                    "on-primary-container": "#f5fff7",
                    "on-error-container": "#93000a",
                    "secondary-fixed": "#b0f0d6",
                    "surface-tint": "#006c4a",
                    "secondary-fixed-dim": "#95d3ba",
                    "tertiary-container": "#b15f00",
                    "secondary": "#2b6954",
                    "on-secondary-fixed": "#002117",
                    "on-background": "#141c2b",
                    "on-secondary": "#ffffff",
                    "on-surface": "#141c2b",
                    "error-container": "#ffdad6",
                    "tertiary": "#8d4b00",
                    "on-primary-fixed-variant": "#005137",
                    "surface-container": "#e8eeff",
                    "surface-bright": "#f9f9ff",
                    "surface": "#f9f9ff",
                    "outline": "#6d7a72",
                    "inverse-surface": "#293041",
                    "surface-container-high": "#e0e8fd"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Manrope"],
                    "display": ["Manrope"],
                    "body": ["Plus Jakarta Sans"],
                    "label": ["Plus Jakarta Sans"]
            }
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .role-card-radio:checked + .role-card-ui {
            background-color: #f5fff7; /* on-primary-container light hint */
            box-shadow: 0 0 0 2px #006948, 0px 12px 32px rgba(20, 28, 43, 0.08);
            transform: scale(1.02);
        }
        .role-card-radio:checked + .role-card-ui .icon-wrapper {
            background-color: #006948;
            color: #ffffff;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col">
<!-- Top Navigation Shell -->
<header class="bg-surface/70 backdrop-blur-md sticky top-0 z-50 shadow-sm bg-gradient-to-b from-slate-100/10 to-transparent">
  <div class="flex justify-between items-center w-full px-6 py-3 max-w-screen-2xl mx-auto">
    <div class="flex items-center gap-4">
      <NuxtLink to="/" class="text-2xl font-bold tracking-tighter text-emerald-800 font-headline">
        Tanya Ustadz
      </NuxtLink>
    </div>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center p-6 lg:p-12">
<div class="max-w-4xl w-full">
<!-- Headline Section -->
<div class="text-center mb-12">
<h1 class="font-headline text-4xl lg:text-5xl font-extrabold text-on-surface tracking-tight mb-4">
                    Masuk Sebagai Apa?
                </h1>
<p class="text-on-surface-variant text-lg max-w-lg mx-auto">
                    Silakan pilih peran Anda untuk melanjutkan ke dashboard yang sesuai dengan wewenang Anda.
                </p>
</div>
<!-- Role Selection Form -->
<form class="space-y-12">
<!-- Bento-style Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Role Card 1: Ustadz -->
<label class="relative group cursor-pointer">
<input class="role-card-radio hidden" name="role_selection" required="" type="radio" value="ustadz"/>
<div class="role-card-ui h-full bg-surface-container-lowest p-8 rounded-[2rem] transition-all duration-300 flex flex-col items-start gap-6 border-2 border-transparent">
<div class="icon-wrapper w-14 h-14 rounded-2xl bg-surface-container-high flex items-center justify-center transition-colors duration-300">
<span class="material-symbols-outlined text-3xl" data-icon="verified_user">verified_user</span>
</div>
<div class="space-y-2">
<h3 class="font-headline text-2xl font-bold text-on-surface">Ustadz</h3>
<p class="text-on-surface-variant leading-relaxed">
                                    Menjawab pertanyaan dan memberikan edukasi hukum Islam.
                                </p>
</div>
<div class="mt-auto pt-4 flex items-center gap-2 text-primary font-semibold opacity-0 group-hover:opacity-100 transition-opacity">
<span>Pilih Peran</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</div>
</div>
</label>
<!-- Role Card 2: Admin IT -->
<label class="relative group cursor-pointer">
<input class="role-card-radio hidden" name="role_selection" type="radio" value="admin"/>
<div class="role-card-ui h-full bg-surface-container-lowest p-8 rounded-[2rem] transition-all duration-300 flex flex-col items-start gap-6 border-2 border-transparent">
<div class="icon-wrapper w-14 h-14 rounded-2xl bg-surface-container-high flex items-center justify-center transition-colors duration-300">
<span class="material-symbols-outlined text-3xl" data-icon="settings">settings</span>
</div>
<div class="space-y-2">
<h3 class="font-headline text-2xl font-bold text-on-surface">Admin IT</h3>
<p class="text-on-surface-variant leading-relaxed">
                                    Mengelola sistem, kategori, dan validasi pertanyaan masuk.
                                </p>
</div>
<div class="mt-auto pt-4 flex items-center gap-2 text-primary font-semibold opacity-0 group-hover:opacity-100 transition-opacity">
<span>Pilih Peran</span>
<span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</div>
</div>
</label>
</div>
<!-- Footer Action -->
<div class="flex flex-col items-center gap-6">
<button class="group relative px-12 py-4 rounded-full font-headline font-bold text-lg text-white bg-gradient-to-br from-primary to-primary-container shadow-[0px_12px_32px_rgba(0,105,72,0.2)] hover:shadow-[0px_16px_40px_rgba(0,105,72,0.3)] transition-all active:scale-95" type="submit">
                        Konfirmasi Peran
                    </button>
<p class="text-on-surface-variant text-sm font-label uppercase tracking-widest flex items-center gap-2">
<span class="material-symbols-outlined text-lg" data-icon="lock">lock</span>
                        Akses Terenkripsi &amp; Aman
                    </p>
</div>
</form>
</div>
</main>
<!-- Background Decoration -->
<div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
<div class="absolute -top-24 -right-24 w-96 h-96 bg-primary-fixed/20 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-24 -left-24 w-96 h-96 bg-secondary-fixed/20 blur-[120px] rounded-full"></div>
</div>
<!-- Responsive Bottom Spacer for Mobile Shell if needed -->
<footer class="md:hidden h-24"></footer>
</body></html>
