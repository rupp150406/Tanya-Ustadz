<html lang="en"><head>

<body class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-[450px] relative mx-auto group">
<!-- Bottom Layer (Green) -->
<div class="absolute bottom-[-15px] left-0 w-full bg-secondary-fixed rounded-[50px] pt-12 pb-4 px-6 flex items-center justify-center gap-2 transform transition-transform duration-300">
<span class="material-symbols-outlined text-on-secondary-fixed text-lg" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="text-on-secondary-fixed font-bold text-sm tracking-wide uppercase">Currently High on Creativity</span>
</div>
<!-- Top Layer (Dark) -->
<div class="relative bg-inverse-surface rounded-[50px] p-8 shadow-[0_8px_30px_rgb(0,0,0,0.12)] transform transition-transform duration-300 hover:scale-[1.02] z-10 flex flex-col gap-8 border border-outline-variant/10">
<!-- Header: Status & Time -->
<div class="flex justify-between items-center w-full text-sm">
<div class="flex items-center gap-2 bg-on-surface/10 px-3 py-1.5 rounded-full border border-on-surface/5">
<div class="w-2 h-2 rounded-full bg-secondary-fixed animate-pulse shadow-[0_0_8px_rgba(166,245,91,0.6)]"></div>
<span class="text-surface font-medium text-xs">Available for work</span>
</div>
<span class="text-surface-variant/60 font-medium text-xs uppercase tracking-wider">8:30 PM</span>
</div>
<!-- Profile Info -->
<div class="flex flex-col items-center gap-4 pt-2">
<div class="text-center">
<h1 class="font-headline font-bold text-2xl text-surface mb-1">Prasanjit Dey</h1>
<p class="text-surface-variant/80 text-sm">Software Engineer</p>
</div>
</div>
<!-- Action Buttons -->
<div class="flex gap-3 w-full mt-2">
<button class="flex-1 bg-surface text-inverse-surface font-semibold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 hover:bg-surface-dim transition-colors group/btn">
<span>Setuju</span>
</button>
<button class="flex-1 bg-surface text-inverse-surface font-semibold py-3.5 px-4 rounded-xl flex items-center justify-center gap-2 hover:bg-surface-dim transition-colors group/btn">
<span>Tolak</span>
</button>
</div>
</div>
</div>
</div>
