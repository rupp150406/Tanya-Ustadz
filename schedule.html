<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: { "primary-green": "#157B4B" },
                    borderRadius: { "card": "1.25rem" },
                    fontFamily: { "headline": ["Plus Jakarta Sans"], "body": ["Inter"] }
                }
            }
        }
    </script>

    <style>
        /* ============================================================
           LIGHT MODE — Default
           ============================================================ */
        :root {
            --bg-widget:      #FFFFFF;
            --bg-card:        #F1F4F0;
            --bg-card-iklan:  #E8EDE6;
            --border-color:   #E2E8E0;
            --text-main:      #000000;
            --text-dim:       #4B5563;
            --text-label:     #157B4B;
            --badge-bg:       #ECFDF5;
            --badge-text:     #157B4B;
            --track-color:    #E2E8E0;
        }

        /* ============================================================
           DARK MODE — triggered by WordPress html[data-theme='dark-mode']
           ============================================================ */
        html[data-theme='dark-mode'] {
            --bg-widget:      #101213;
            --bg-card:        #1D2327;
            --bg-card-iklan:  #252C2E;
            --border-color:   #3E464B;
            --text-main:      #FFFFFF;
            --text-dim:       #9CA3AF;
            --text-label:     #4ADE80;
            --badge-bg:       #1A3028;
            --badge-text:     #4ADE80;
            --track-color:    #3E464B;
        }

        /* ============================================================
           BASE
           ============================================================ */
        body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* ============================================================
           THEME UTILITY CLASSES
           Use these in JS-generated HTML — never hardcoded bg-white etc.
           ============================================================ */
        .theme-widget {
            background-color: var(--bg-widget);
            transition: background-color 0.3s ease;
        }
        .theme-card {
            background-color: var(--bg-card);
            border-color: var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .theme-card-iklan {
            background-color: var(--bg-card-iklan);
            border-color: var(--border-color);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .theme-text-main {
            color: var(--text-main);
            transition: color 0.3s ease;
        }
        .theme-text-dim {
            color: var(--text-dim);
            transition: color 0.3s ease;
        }
        .theme-text-label {
            color: var(--text-label);
            transition: color 0.3s ease;
        }
        .theme-badge {
            background-color: var(--badge-bg);
            color: var(--badge-text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .theme-dot {
            background-color: var(--bg-widget);
            transition: background-color 0.3s ease;
        }

        /* ============================================================
           LIVE / RUNNING CARD — locked, never changes with theme
           ============================================================ */
        .card-running {
            background-color: #157B4B !important;
            border-color:     #157B4B !important;
            box-shadow: 0 10px 15px -3px rgba(21,123,75,0.25),
                        0 0 0 4px rgba(21,123,75,0.15);
            transform: scale(1.05);
            z-index: 10;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }
        .text-force-white { color: #FFFFFF !important; }

        /* ============================================================
           TIMELINE
           ============================================================ */
        #timeline-axis {
            position: absolute;
            bottom: 20px;
            left: 0;
            height: 20px;
            z-index: 10;
        }
        #timeline-track {
            position: absolute;
            top: 50%;
            left: 0;
            height: 2px;
            background: var(--track-color);
            transform: translateY(-50%);
            z-index: 1;
            transition: background-color 0.3s ease;
        }
    </style>
</head>

<body class="bg-transparent">

    <div id="schedule-widget" class="theme-widget w-full h-[250px] overflow-hidden flex flex-col font-headline relative">

        <!-- ── Header ── -->
        <div class="theme-widget px-5 pt-4 pb-2 flex items-center justify-between z-30 relative">
            <div class="flex items-baseline gap-2">
                <span class="theme-text-label font-extrabold text-sm tracking-widest uppercase">JADWAL SIARAN</span>
                <span id="current-date" class="theme-text-dim font-medium text-xs">Memuat...</span>
            </div>
            <div id="live-indicator" class="hidden items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></span>
                <span class="text-[10px] font-bold text-red-500 uppercase tracking-tighter">On Air</span>
            </div>
        </div>

        <!-- ── Scrollable Timeline ── -->
        <div class="flex-1 relative overflow-x-auto no-scrollbar scroll-smooth">
            <div id="timeline-axis">
                <div id="timeline-track"></div>
                <div id="dots-container" class="relative w-full h-full flex gap-4 px-5 items-center z-10"></div>
            </div>
            <div id="schedule-container" class="flex items-stretch gap-4 px-5 pt-2 pb-20 relative z-20"></div>
        </div>

    </div>

    <script>
        /* ── Supabase ── */
        const SUPABASE_URL = 'https://zvuiumzuotwfgbbenhcm.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2dWl1bXp1b3R3ZmdiYmVuaGNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYwNjk5NjIsImV4cCI6MjA5MTY0NTk2Mn0.jGGhrpNVmclXM9I8ss7R5ukJNLQjaCMcAFkqYDcJLrU';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* ── Icon mapper ── */
        const iconMapper = (name) => {
            const map = { waking_up: 'wb_twilight', sholat: 'mosque', study: 'menu_book', rest: 'bedtime' };
            return map[name] || name || 'play_circle';
        };

        /* ══════════════════════════════════════════════
           RENDER SCHEDULE
        ══════════════════════════════════════════════ */
        async function initSchedule() {
            const now        = new Date();
            const days       = ['Ahad','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
            const currentDay = days[now.getDay()];
            const hhmm       = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

            document.getElementById('current-date').innerText =
                `${currentDay}, ${now.toLocaleDateString('id-ID', { day:'numeric', month:'short' })}`;

            try {
                const { data: schedules, error } = await supabaseClient
                    .from('jadwal_siaran')
                    .select('*')
                    .eq('hari', currentDay)
                    .order('jam_mulai', { ascending: true });

                if (error) throw error;

                const cardsEl = document.getElementById('schedule-container');
                const dotsEl  = document.getElementById('dots-container');
                const trackEl = document.getElementById('timeline-track');

                cardsEl.innerHTML = '';
                dotsEl.innerHTML  = '';

                let activeCardId = null;

                schedules.forEach((item, i) => {
                    const next      = schedules[i + 1];
                    const isRunning = hhmm >= item.jam_mulai && (!next || hhmm < next.jam_mulai);
                    if (isRunning) activeCardId = `card-${i}`;

                    const isIklan   = item.is_iklan;
                    const w         = isIklan ? 'w-[180px]' : 'w-[260px]';
                    const icon      = iconMapper(item.icon);
                    const fillStyle = (item.is_live || isRunning) ? "font-variation-settings:'FILL' 1;" : '';

                    /* ── Class decisions — theme-* only, zero hardcoded colors ── */
                    let cardCls, textMain, textSub, badgeCls, iconCls;

                    if (isRunning) {
                        cardCls  = 'card-running';
                        textMain = 'text-force-white';
                        textSub  = 'text-force-white opacity-80';
                        badgeCls = 'bg-white !text-[#157B4B]';
                        iconCls  = 'text-force-white';
                    } else if (isIklan) {
                        cardCls  = 'theme-card-iklan border border-dashed border-[#157B4B]/30';
                        textMain = 'theme-text-main';
                        textSub  = 'theme-text-dim';
                        badgeCls = 'theme-badge';
                        iconCls  = 'theme-text-dim';
                    } else {
                        cardCls  = 'theme-card border shadow-sm';
                        textMain = 'theme-text-main';
                        textSub  = 'theme-text-dim';
                        badgeCls = item.is_live ? 'bg-[#157B4B] text-white' : 'theme-badge';
                        iconCls  = item.is_live ? 'text-[#157B4B]'          : 'theme-text-dim';
                    }

                    /* ── Card ── */
                    cardsEl.innerHTML += `
                        <div id="card-${i}" class="flex-shrink-0 ${w} flex flex-col relative transition-all duration-500">
                            <div class="flex-1 rounded-card p-3 ${cardCls} flex flex-col justify-between">
                                <div>
                                    <div class="flex justify-between items-start mb-1">
                                        <span class="text-[10px] font-bold ${badgeCls} px-2 py-0.5 rounded-full uppercase">
                                            ${item.jam_mulai}
                                        </span>
                                        <span class="material-symbols-outlined text-lg ${iconCls}" style="${fillStyle}">
                                            ${icon}
                                        </span>
                                    </div>
                                    <h3 class="font-bold text-[13px] leading-tight mb-0.5 line-clamp-2 ${textMain}">
                                        ${item.acara}
                                    </h3>
                                </div>
                                <p class="text-[11px] font-medium truncate mt-1 ${textSub}">${item.pemateri || ''}</p>
                            </div>
                        </div>`;

                    /* ── Dot ── */
                    dotsEl.innerHTML += `
                        <div class="${w} flex-shrink-0 flex items-center justify-center h-full">
                            <div class="${isRunning
                                ? 'w-4 h-4 bg-white shadow-[0_0_8px_rgba(21,123,75,0.6)]'
                                : 'w-3 h-3 theme-dot'
                            } rounded-full border-2 border-[#157B4B] flex items-center justify-center relative z-20 transition-all duration-300">
                                ${isRunning ? '<div class="w-1.5 h-1.5 rounded-full bg-[#157B4B] animate-pulse"></div>' : ''}
                            </div>
                        </div>`;
                });

                /* ── Fit track width & scroll to active ── */
                setTimeout(() => {
                    const totalW = cardsEl.scrollWidth;
                    if (trackEl) trackEl.style.width = totalW + 'px';
                    const axisEl = document.getElementById('timeline-axis');
                    if (axisEl)  axisEl.style.width  = totalW + 'px';

                    if (activeCardId) {
                        document.getElementById(activeCardId)
                            .scrollIntoView({ behavior:'smooth', inline:'center', block:'nearest' });
                        document.getElementById('live-indicator').classList.replace('hidden','flex');
                    }
                }, 200);

            } catch (err) {
                console.error('Schedule error:', err.message);
            }
        }

        /* ══════════════════════════════════════════════
           WORDPRESS THEME OBSERVER
           Watches html[data-theme] changes in real-time.
           CSS variables handle all color switching —
           the observer just ensures repaints fire cleanly.
        ══════════════════════════════════════════════ */
        function initThemeObserver() {
            const observer = new MutationObserver(() => {
                /* Force a style recalculation so CSS var transitions trigger */
                document.getElementById('schedule-widget').style.transition = 'background-color 0.3s ease';
            });
            observer.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ['data-theme', 'class']
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initThemeObserver();
            initSchedule();
        });
    </script>

</body>
</html>
